[package]
name = "pipefish-recon-kernel"
version = "0.2.0"
edition = "2021"
rust-version = "1.83"

[dependencies]
# Exact pins keep Cargo 1.83 off edition2024 transitives (tokio 1.44+,
# url 2.5.5+, hyper-util 0.1.17+, …) that reqwest would otherwise pull.
tokio = { version = "=1.41.1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "=1.11.1", features = ["v4", "serde"] }
chrono = { version = "=0.4.38", features = ["serde"] }
tokio-util = "=0.7.12"
axum = "=0.7.9"
tower-http = { version = "=0.5.2", features = ["cors"] }
reqwest = { version = "=0.11.27", default-features = false, features = ["json", "rustls-tls"] }
hyper-util = "=0.1.10"
url = "=2.5.0"
encoding_rs = "=0.8.35"
idna = "=0.5.0"
indexmap = "=2.6.0"
hashbrown = "=0.15.2"
backtrace = "=0.3.74"
home = "=0.5.9"

[dev-dependencies]
tower = { version = "=0.5.1", features = ["util"] }
http-body-util = "=0.1.2"

[dependencies.oqs]
version = "0.9"
optional = true

[features]
default = []
pq-crypto = ["oqs"]
