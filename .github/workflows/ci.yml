name: CI
on: [push, pull_request]
jobs:
  kernel-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Cargo check
        run: cargo check --manifest-path kernel/Cargo.toml
      - name: Cargo test
        run: cargo test --manifest-path kernel/Cargo.toml
      - name: Cargo clippy
        run: cargo clippy --manifest-path kernel/Cargo.toml
