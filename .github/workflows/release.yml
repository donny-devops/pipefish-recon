name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build Binary (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact_name: pipefish-recon-kernel-linux-x86_64
          - target: x86_64-apple-darwin
            os: macos-13
            artifact_name: pipefish-recon-kernel-macos-x86_64
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact_name: pipefish-recon-kernel-macos-arm64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact_name: pipefish-recon-kernel-windows-x86_64.exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --manifest-path kernel/Cargo.toml --release --target ${{ matrix.target }}

      - name: Stage binary (Unix)
        if: runner.os != 'Windows'
        run: |
          cp target/${{ matrix.target }}/release/pipefish-recon-kernel ${{ matrix.artifact_name }}
          chmod +x ${{ matrix.artifact_name }}

      - name: Stage binary (Windows)
        if: runner.os == 'Windows'
        run: |
          copy target\${{ matrix.target }}\release\pipefish-recon-kernel.exe ${{ matrix.artifact_name }}

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}
